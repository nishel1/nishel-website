<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>NISHEL · Lead Desk</title>
<style>
:root{color-scheme:light;--ink:#18372d;--muted:#68766e;--paper:#f5f4ed;--line:#dfe3d9;--green:#183d30}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 system-ui,-apple-system,sans-serif}.wrap{max-width:1050px;margin:auto;padding:28px 18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{font:clamp(32px,6vw,52px)/1.05 Georgia,serif;margin:12px 0}p{color:var(--muted)}.panel,.lead{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin:14px 0}.login{max-width:430px;margin:12vh auto}.field{display:block;margin:12px 0}.field input{width:100%;padding:13px;border:1px solid var(--line);border-radius:10px;font:inherit}button,select,.btn{border:0;border-radius:10px;padding:11px 15px;background:var(--green);color:white;font:600 14px system-ui;cursor:pointer}button.secondary{background:#e9eee7;color:var(--ink)}.hidden{display:none}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.meta{font-size:12px;color:var(--muted)}.status{background:#eef2eb;color:var(--ink);border:1px solid var(--line)}.message{white-space:pre-wrap;overflow-wrap:anywhere}.error{color:#a32929}.empty{text-align:center;padding:35px;color:var(--muted)}a{color:var(--green)}
</style></head><body><main class="wrap"><div class="top"><div><div class="meta">NISHEL · PRIVATE WORKSPACE</div><h1>Lead desk.</h1><p>Customer enquiries in one simple place.</p></div><a href="/" class="meta">← Public website</a></div>
<section id="login" class="panel login"><h2>Admin sign in</h2><p>Enter the private admin password configured in Cloudflare. Do not share it with customers.</p><label class="field">Admin password<input id="password" type="password" autocomplete="current-password"></label><button id="signIn">Open lead desk</button><p id="loginMsg" class="error"></p></section>
<section id="desk" class="hidden"><div class="row"><div><h2>Customer enquiries</h2><p id="count">Loading…</p></div><div class="row"><button class="secondary" id="refresh">Refresh</button><button class="secondary" id="logout">Sign out</button></div></div><div id="list"></div></section>
</main><script>
let secret="";const $=id=>document.getElementById(id);
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
async function load(){const r=await fetch("/api/admin/leads",{headers:{"x-admin-password":secret}});const d=await r.json();if(!r.ok)throw Error(d.error||"Could not load leads");const leads=d.leads||[];$("count").textContent=leads.length+" latest enquiries";$("list").innerHTML=leads.length?leads.map(x=>'<article class="lead"><div class="row"><strong>#'+x.id+' · '+esc(x.name)+'</strong><span class="meta">'+esc(x.created_at)+'</span></div><p><b>'+esc(x.need)+'</b> · '+esc(x.phone)+(x.email?' · '+esc(x.email):'')+'</p><p class="message">'+esc(x.message||"No additional details")+'</p><div class="row"><a href="https://wa.me/'+esc(x.phone.replace(/[^0-9]/g,""))+'" target="_blank" rel="noopener">WhatsApp customer ↗</a><select class="status" data-id="'+x.id+'">'+["New","Contacted","In Progress","Converted","Closed"].map(s=>'<option '+(s===x.status?'selected':'')+'>'+s+'</option>').join("")+'</select></div></article>').join(""):'<div class="panel empty">No enquiries yet. New customer submissions will appear here.</div>';$("list").querySelectorAll("select").forEach(s=>s.addEventListener("change",async()=>{const r=await fetch("/api/admin/leads/"+s.dataset.id,{method:"PATCH",headers:{"content-type":"application/json","x-admin-password":secret},body:JSON.stringify({status:s.value})});if(!r.ok)alert("Could not update status. Please sign in again.");}));}
$("signIn").onclick=async()=>{secret=$("password").value;if(!secret)return;$("loginMsg").textContent="";try{await load();$("login").classList.add("hidden");$("desk").classList.remove("hidden");}catch(e){secret="";$("loginMsg").textContent=e.message;}};
$("refresh").onclick=()=>load().catch(e=>alert(e.message));$("logout").onclick=()=>{secret="";$("password").value="";$("desk").classList.add("hidden");$("login").classList.remove("hidden");};
$("password").addEventListener("keydown",e=>{if(e.key==="Enter")$("signIn").click();});
</script></body></html>
